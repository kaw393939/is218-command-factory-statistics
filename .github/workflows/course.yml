name: Course checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worked-stage requirements
        run: |
          git show origin/learn/06-ci:requirements.txt > /tmp/course-requirements.txt
          python -m pip install -r /tmp/course-requirements.txt
      - name: Verify readings and every worked stage
        run: python tools/verify_course.py --full
