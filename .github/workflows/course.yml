name: Course consistency
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch cumulative learning branches
        run: git fetch --no-tags origin '+refs/heads/learn/*:refs/remotes/origin/learn/*'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify textbook and actual learning branches
        run: python tools/verify_course.py --full
